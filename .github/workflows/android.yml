name: Android APK

# android/ ফোল্ডারে কিছু বদলালে বা হাতে চালালে ক্লাউডে APK তৈরি হবে,
# আর Releases-এ "app-latest" নামে ফোনে নামানোর লিঙ্ক আসবে।
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret নেই"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: my-key-alias
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk BiologyStudyCentre.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest BiologyStudyCentre.apk \
            --title "জীববিজ্ঞান অ্যাপ (বিল্ড ${{ github.run_number }})" \
            --notes "ফোনে এই APK নামিয়ে ইনস্টল করুন। অভিভাবকের WhatsApp-এ সরাসরি রশিদ যায়।"

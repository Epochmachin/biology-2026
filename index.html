<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>জীববিজ্ঞান স্টাডি সেন্টার</title>
<meta name="theme-color" content="#1E3A8A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="জীববিজ্ঞান">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Baloo Da 2';font-weight:600;font-display:swap;src:url(fonts/baloo-da-2-bengali-600-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo Da 2';font-weight:700;font-display:swap;src:url(fonts/baloo-da-2-bengali-700-normal.woff2) format('woff2')}
@font-face{font-family:'Hind Siliguri';font-weight:400;font-display:swap;src:url(fonts/hind-siliguri-bengali-400-normal.woff2) format('woff2')}
@font-face{font-family:'Hind Siliguri';font-weight:500;font-display:swap;src:url(fonts/hind-siliguri-bengali-500-normal.woff2) format('woff2')}
</style>
<style>
:root{
  --bg:#EEF2F7; --card:#FFFFFF; --ink:#0F172A; --soft:#64748B; --line:#E2E8F0;
  --ok:#047857; --okbg:#D1FAE5; --bad:#B91C1C; --badbg:#FEE2E2; --warn:#B45309; --warnbg:#FEF3C7;
  --accent:#2563EB; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans Bengali',system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:84px}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}

/* header */
.bar{background:linear-gradient(135deg,#1E3A8A,var(--accent));color:#fff;padding:8px 0 10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand h1{font-size:19px;margin:0;font-weight:700;line-height:1.2}
.brand small{display:block;font-size:13px;opacity:.9;font-weight:500}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.16);padding:3px;border-radius:11px;margin-top:8px}
.seg-btn{flex:1;border:0;background:transparent;color:#fff;padding:7px 6px;border-radius:9px;font-weight:600;font-size:15px}
.seg-btn.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg-note{flex:1;text-align:center;padding:6px;font-size:14px;opacity:.95}
.light .seg{background:#E2E8F0}
.light .seg-btn{color:var(--ink)}
.light .seg-btn.on{color:var(--accent)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 8px}
.stat{background:var(--card);border-radius:12px;padding:9px 6px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--soft)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.stat.bad{cursor:pointer}
.alert{display:block;width:100%;text-align:left;border:1px solid #FCD34D;background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:600;margin-bottom:8px}
.tools{display:flex;gap:8px;align-items:center;margin:6px 0 10px}
.search{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;min-width:0}
.add{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 14px;font-weight:700;white-space:nowrap}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* card */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);border-left:5px solid var(--accent);padding:12px;margin-bottom:10px}
.c-top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.c-name{font-size:18px;font-weight:700;cursor:pointer}
.chip{font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.bad{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)} .chip.soft{background:#F1F5F9;color:var(--soft)}
.c-phone{font-size:14px;color:var(--soft);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-phone.bad{color:var(--bad);font-weight:600}
.wa-ok{color:var(--ok);font-weight:600}
.c-due{margin-top:6px;font-size:14px;color:var(--bad);font-weight:600}
.c-note{margin-top:4px;font-size:13px;color:var(--warn)}
.c-actions{display:flex;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pay{flex:1;background:var(--accent);color:#fff;border-color:var(--accent);font-size:16px}
.btn.icon{width:48px;padding:11px 0;font-size:18px}
.btn.big{width:100%;padding:15px;font-size:17px;margin-top:12px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.green{background:#16A34A;color:#fff;border-color:#16A34A}
.btn.ghost{width:100%;margin-top:10px;background:#F8FAFC;color:var(--soft)}
.btn:disabled{opacity:.45}
.mini{border:1px solid var(--line);background:#F8FAFC;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.mini.wa{background:#DCFCE7;color:#166534;border-color:#86EFAC}
.mini.danger{color:var(--bad);background:var(--badbg);border-color:#FCA5A5}
.exp{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.strip div{font-size:12px;text-align:center;border-radius:6px;padding:4px 0;background:#F1F5F9;color:var(--soft)}
.strip .p{background:var(--okbg);color:var(--ok);font-weight:700}
.strip .d{background:var(--badbg);color:var(--bad);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.empty{text-align:center;color:var(--soft);padding:30px 10px;background:#fff;border-radius:var(--radius);border:1px dashed #CBD5E1}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--soft);padding:4px 0;font-weight:600}
.nav button span{font-size:21px;line-height:1.1}
.nav button.on{color:var(--accent)}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:4px auto 10px}
.sh-head{border-left:5px solid var(--accent);padding-left:10px;margin-bottom:10px}
.sh-name{font-size:21px;font-weight:700}
.sh-sub{color:var(--soft);font-size:14px}
label.f{display:block;font-size:14px;color:var(--soft);margin-top:10px;font-weight:600}
label.f input,label.f select,label.f textarea,.inp{display:block;width:100%;margin-top:4px;border:1px solid #CBD5E1;border-radius:10px;padding:11px 12px;background:#fff;font-size:16px;color:var(--ink)}
.inp.err,label.f input.err{border-color:var(--bad);background:#FFF5F5}
.hint{font-size:13px;color:var(--soft);margin-top:4px}
.hint.err{color:var(--bad);font-weight:600}
textarea{resize:vertical}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mcell{border:2px solid var(--line);background:#fff;border-radius:12px;min-height:64px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mcell b{font-size:16px}
.mcell small{font-size:12px;color:var(--soft);min-height:16px}
.mcell.cur{border-color:#93C5FD}
.mcell.due{border-color:#FCA5A5;background:#FFF7F7}
.mcell.due small{color:var(--bad);font-weight:600}
.mcell.sel{border-color:var(--accent);background:var(--accent);color:#fff}
.mcell.sel small{color:#fff}
.mcell.paid{background:var(--okbg);border-color:#6EE7B7;color:var(--ok)}
.mcell.paid small{color:var(--ok)}
.tile{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;font-weight:600}
.tile.on{border-color:var(--warn);background:var(--warnbg)}
.tile.done{background:var(--okbg);border-color:#6EE7B7;color:var(--ok);justify-content:space-between}
.tile input{width:22px;height:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plist{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.plist h4,.sec h4{margin:6px 0;font-size:15px}
.pl-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #F1F5F9;font-size:14px}
.pl-row span{flex:1}
.rcpt{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:6px}
.rcimg{display:block;width:100%;min-height:220px;margin:6px 0 10px;border-radius:14px;border:1px solid var(--line);background:#F1F5F9}
.rcpt-h{background:var(--accent);color:#fff;text-align:center;padding:12px}
.rcpt-h b{display:block;font-size:19px}
.rcpt-b{padding:12px 14px;white-space:pre-wrap;font-size:15px}
.rcpt-s{text-align:right;padding:0 14px 12px}
.rcpt-s img{height:54px}
.q-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #F1F5F9}
.q-row span{flex:1}
.q-row.sent span{color:var(--ok)}
.donebox{background:var(--okbg);color:var(--ok);font-weight:700;text-align:center;border-radius:12px;padding:14px;margin-top:12px}
.pre{white-space:pre-wrap;background:#F8FAFC;border-radius:10px;padding:10px;font-size:14px;font-family:inherit}
.att-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F1F5F9}
.att-row .nm{flex:1;font-weight:600}
.pbtn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;min-width:96px;background:var(--okbg);color:var(--ok)}
.pbtn.ab{background:var(--badbg);color:var(--bad)}
.lbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.lbtn.on{background:var(--warnbg);color:var(--warn);border-color:#FCD34D}
.lmin{width:62px;border:1px solid #CBD5E1;border-radius:8px;padding:7px;font-size:15px}
.menu button{display:flex;width:100%;align-items:center;gap:12px;border:0;border-bottom:1px solid #F1F5F9;background:#fff;padding:14px 4px;font-size:16px;font-weight:600;text-align:left}
.menu button span{font-size:20px;width:28px;text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.t td,table.t th{border-bottom:1px solid #F1F5F9;padding:7px 4px;text-align:left;vertical-align:top}
table.t th{color:var(--soft);font-weight:600}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
/* ইনস্টল ব্যানার */
.inst{position:fixed;left:10px;right:10px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:30;background:#0F172A;color:#fff;border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:620px;margin:0 auto}
.inst.show{display:flex}
.inst img{width:42px;height:42px;border-radius:10px}
.inst div{flex:1;font-size:14px;line-height:1.35}
.inst b{display:block;font-size:15px}
.inst .go{background:#2563EB;color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600}
.inst .x{background:none;border:0;color:#94A3B8;font-size:20px;padding:0 4px}
/* অ্যাপ মোডে: লেখা সিলেক্ট/টেনে রিফ্রেশ বন্ধ, অ্যাপের মতো অনুভূতি */
@media (display-mode: standalone){
  html,body{overscroll-behavior-y:none}
  body{-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  .bar{padding-top:calc(8px + env(safe-area-inset-top))}
}
.mk{width:80px;border:1px solid #CBD5E1;border-radius:8px;padding:8px;font-size:16px;text-align:center}
details summary{cursor:pointer;color:var(--soft);margin-top:12px;font-size:14px}
@media (max-width:380px){.stat b{font-size:16px}.stat span{font-size:11px}.btn.icon{width:42px}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand">
      <img src="icon.png" alt="">
      <div><h1>জীববিজ্ঞান স্টাডি সেন্টার</h1><small id="batchTitle"></small></div>
    </div>
    <div class="seg" id="branchSeg"></div>
    <div class="seg" id="classSeg"></div>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div id="alerts"></div>
  <div class="tools">
    <input class="search" id="search" type="search" placeholder="🔍 নাম বা নম্বর দিয়ে খুঁজুন">
    <button class="add" data-act="addStudent">+ শিক্ষার্থী</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>

<nav class="nav">
  <button data-act="attendance"><span>✅</span>হাজিরা</button>
  <button data-act="dueTab" id="navDue"><span>💰</span>বকেয়া</button>
  <button data-act="exams"><span>📝</span>পরীক্ষা</button>
  <button data-act="messages"><span>💬</span>মেসেজ</button>
  <button data-act="more"><span>☰</span>আরও</button>
</nav>

<input type="file" id="restoreInput" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>
<div class="inst" id="inst">
  <img src="icon-192.png" alt="">
  <div><b>অ্যাপ হিসেবে ইনস্টল করুন</b><span id="instMsg">হোম স্ক্রিনে আইকন, ব্রাউজারের বার ছাড়া পুরো স্ক্রিনে চলবে</span></div>
  <button class="go" id="instGo">ইনস্টল</button>
  <button class="x" id="instX" aria-label="বন্ধ">✕</button>
</div>

/* ========== ছোট সহায়ক ========== */
const $ = s => document.querySelector(s);
const toBn = n => String(n ?? '').replace(/[0-9]/g, d => BN[d]);
const fromBn = s => String(s ?? '').replace(/[০-৯]/g, d => BN.indexOf(d));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const TODAY = (() => {
  const q = new URLSearchParams(location.search).get('today');
  if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) { const [y,m,d] = q.split('-').map(Number); return new Date(y, m-1, d); }
  return new Date();
})();
const ym = (y, m) => y + '-' + pad(m + 1);
const ymP = k => { const [y, m] = k.split('-').map(Number); return {y, m: m - 1}; };
const ymLabel = k => { const {y, m} = ymP(k); return MONTHS[m] + ' ' + toBn(y); };
const CUR_YM = ym(TODAY.getFullYear(), TODAY.getMonth());
const todayKey = () => TODAY.getFullYear() + '-' + pad(TODAY.getMonth() + 1) + '-' + pad(TODAY.getDate());
const bnDate = d => { const [y, m, dd] = d.split('-').map(Number); return toBn(dd) + ' ' + MONTHS[m - 1] + ', ' + toBn(y); };
function hash(str){ let h = 5381; for (const c of str) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(36).toUpperCase().slice(-6).padStart(6, '0'); }
let idc = 1; const makeId = p => (p || 'stu') + '_' + Date.now() + '_' + (idc++);

function normPhone(p){
  let d = fromBn(p).replace(/\D/g, '');
  if (d.startsWith('880')) d = d.slice(2);
  else if (d.startsWith('88') && d.length === 13) d = d.slice(2);
  if (d.length === 10 && d[0] === '1') d = '0' + d;
  return d;
}
const validPhone = p => /^01[3-9]\d{8}$/.test(normPhone(p));
const waNum = p => '88' + normPhone(p);
/* নিজস্ব Android অ্যাপের ভেতরে চললে: সরাসরি WhatsApp/ফাইল সেভের সুবিধা */

/* ========== ডেটা ========== */
function freshStore(){
  const b = {};
  for (const k in DEFAULT_BATCHES) b[k] = {...DEFAULT_BATCHES[k], fee:1000, dueDay:10, noteFee:1000, start: APP_YEAR + '-01'};
  return {version:2, year:APP_YEAR,
    settings:{teacher:TEACHER_DEFAULT, phone:TEACHER_PHONE_DEFAULT, channel:'wa', sms:{enabled:false, url:'', pin:''}},
    batches:b, students:[], payments:{}, noteFees:{}, attendance:{}, exams:{}, templates:{}, sent:{}};
}
function migrate(s){
  const f = freshStore();
  s.settings = {...f.settings, ...(s.settings || {})};
  s.settings.sms = {...f.settings.sms, ...((s.settings || {}).sms || {})};
  s.batches = s.batches || {};
  for (const k in f.batches) s.batches[k] = {...f.batches[k], ...(s.batches[k] || {})};
  for (const x of ['payments','noteFees','attendance','exams','templates','sent']) s[x] = s[x] || {};
  s.students = s.students || [];
  s.year = s.year || APP_YEAR;
  s.version = 2;
  return s;
}
function load(){ try { const r = localStorage.getItem(KEY); if (r) return migrate(JSON.parse(r)); } catch(e){} return freshStore(); }
let S = load();
function save(){
  try {
    const keys = Object.keys(S.sent).sort();
    if (keys.length > 80) keys.slice(0, keys.length - 80).forEach(k => delete S.sent[k]);
    localStorage.setItem(KEY, JSON.stringify(S)); return true;
  } catch(e){ toast('সেভ হয়নি! ফোনের জায়গা দেখুন'); return false; }
}
function getArchive(){ try { return JSON.parse(localStorage.getItem(ARCH_KEY) || 'null'); } catch(e){ return null; } }
function setArchive(a){ try { localStorage.setItem(ARCH_KEY, JSON.stringify(a)); } catch(e){ toast('আর্কাইভ রাখা যায়নি'); } }

let ACTIVE = (() => { try { const a = localStorage.getItem(ACTIVE_KEY); if (a && DEFAULT_BATCHES[a]) return a; } catch(e){} return 'up9'; })();

const B = id => S.batches[id];
const stu = id => S.students.find(s => s.id === id);
const list = () => S.students.filter(s => s.batch === ACTIVE);
const batchName = id => { const b = B(id); return b.branch + ' · ' + b.clsLabel + ' শ্রেণি'; };
const paid = (sid, k) => S.payments[sid] && S.payments[sid][k];
const noteFeePaid = s => S.noteFees[s.id] && S.noteFees[s.id][S.year];
function monthsRange(from, to){
  const out = []; let {y, m} = ymP(from); const t = ymP(to);
  while (y < t.y || (y === t.y && m <= t.m)) { out.push(ym(y, m)); m++; if (m > 11) { m = 0; y++; } }
  return out;
}
function dueList(s){
  const b = B(s.batch); if (!b || CUR_YM < b.start) return [];
  return monthsRange(b.start, CUR_YM).filter(k => {
    if (paid(s.id, k)) return false;
    if (k < CUR_YM) return true;
    return s.payMode !== 'monthEnd' && TODAY.getDate() > Number(b.dueDay || 10);
  });
}
function curStatus(s){
  if (paid(s.id, CUR_YM)) return 'paid';
  const b = B(s.batch);
  if (CUR_YM < b.start) return 'na';
  if (s.payMode === 'monthEnd') return 'later';
  return TODAY.getDate() > b.dueDay ? 'due' : 'wait';
}
const waPending = s => !validPhone(s.guardianPhone) || !s.waVerified;

let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
let SHEET_KIND = null;
function sheet(html, kind){
  let bd = $('#sheet');
  let keep = 0;
  if (!bd) {
    bd = document.createElement('div'); bd.id = 'sheet'; bd.className = 'backdrop';
    bd.addEventListener('click', e => { if (e.target === bd) closeSheet(); });
    document.body.appendChild(bd);
    history.pushState({sheet:1}, '');
  } else if (kind && kind === SHEET_KIND) {
    keep = bd.firstElementChild ? bd.firstElementChild.scrollTop : 0;
  }
  SHEET_KIND = kind || null;
  bd.innerHTML = '<div class="sheet" role="dialog"><div class="grab"></div>' + html + '</div>';
  if (keep) bd.firstElementChild.scrollTop = keep;
  document.body.classList.add('noscroll');
}
function closeSheet(fromPop){
  const bd = $('#sheet'); if (!bd) return;
  bd.remove(); SHEET_KIND = null; document.body.classList.remove('noscroll');
  if (!fromPop && history.state && history.state.sheet) { IGNORE_POP = true; history.back(); }
}
let IGNORE_POP = false;
window.addEventListener('popstate', () => { if (IGNORE_POP) { IGNORE_POP = false; return; } if ($('#sheet')) closeSheet(true); });

/* ========== মেসেজ পাঠানো ========== */
function sendMsg(phone, text, channel){
  const p = normPhone(phone);
  if (!validPhone(p)) { toast('নম্বর ঠিক নেই'); return false; }
  channel = channel || S.settings.channel;
  if (channel === 'sms' && S.settings.sms.enabled && S.settings.sms.url) { gatewaySend([{to:p, text}]); return true; }
  if (channel === 'sms') {
    const sep = /iPad|iPhone|iPod/.test(navigator.userAgent) ? '&' : '?';
    location.href = 'sms:' + p + sep + 'body=' + encodeURIComponent(text); return true;
  }
  const url = 'https://wa.me/' + waNum(p) + '?text=' + encodeURIComponent(text);
  const w = window.open(url, '_blank'); if (!w) location.href = url;
  return true;
}
async function gatewaySend(msgs){
  toast('SMS পাঠানো হচ্ছে…');
  try {
    const r = await fetch(S.settings.sms.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({pin:S.settings.sms.pin, messages:msgs})});
    const j = await r.json().catch(() => ({}));
    if (j.ok) { toast(toBn(j.sent ?? msgs.length) + 'টি SMS পাঠানো হয়েছে ✓'); return true; }
    toast('SMS যায়নি: ' + (j.error || r.status));
  } catch(e) { toast('SMS সার্ভারে পৌঁছানো যায়নি'); }
  return false;
}
const sign = () => `\n\nধন্যবাদান্তে,\n${S.settings.teacher}\n${CENTER}\n(${toBn(S.settings.phone)})`;

async function copyText(t){

}

    <button class="btn ghost" data-act="close">বন্ধ করুন</button>`, 'queue');

function markSent(key, sids){ S.sent[key] = [...new Set([...(S.sent[key] || []), ...sids])]; save(); }
function qOne(sid){
  const it = Q.items.find(i => i.sid === sid); if (!it) return;
  if (sendMsg(it.phone, it.text, Q.channel)) { markSent(Q.logKey, [sid]); setTimeout(renderQueue, 250); }
}
async function qAll(){
  const sent = new Set(S.sent[Q.logKey] || []);
  const rest = Q.items.filter(i => !sent.has(i.sid) && validPhone(i.phone));

/* রশিদের "মাসিক অগ্রগতি": কোন মাসের হাজিরা, আর সেই সময়ের পরীক্ষা */
function progressData(s, on){
  const [Y, M, D] = on.split('-').map(Number);
  const A = S.attendance[s.batch] || {}, keys = Object.keys(A).filter(k => k <= on);
  /* আগের মাস, চলতি মাস: যেটাতে হাজিরা আছে সেটা (২৫ তারিখের পরে হলে চলতি মাস আগে) */
  const ymOf = (yy, mm) => yy + '-' + String(mm).padStart(2, '0');
  const prev = M === 1 ? ymOf(Y - 1, 12) : ymOf(Y, M - 1), cur = ymOf(Y, M);
  const order = D >= 25 ? [cur, prev] : [prev, cur];
  let ym = order.find(k => keys.some(d => d.startsWith(k)));
  if (!ym) { const last = keys.sort().pop(); ym = last ? last.slice(0, 7) : null; }
  const days = ym ? keys.filter(k => k.startsWith(ym)).sort() : [];
  let att = null;
  if (days.length) {
    const [y, m] = ym.split('-').map(Number), partial = ym === cur && D < 25;
    const marks = days.map(k => A[k].p.includes(s.id) ? ((A[k].late || {})[s.id] ? 'L' : 'P') : 'A');
    const pres = marks.filter(c => c !== 'A').length;
    att = {label: MONTHS[m - 1] + ' ' + toBn(y) + (partial ? ' (এ পর্যন্ত)' : ''), total: days.length, pres, late: marks.filter(c => c === 'L').length, pct: Math.round(pres * 100 / days.length), marks: marks.slice(-26)};
  }
  const from = new Date(Date.UTC(Y, M - 1, D - 60)).toISOString().slice(0, 10);
  const ex = Object.values(S.exams[s.batch] || {}).filter(e => e.date >= from && e.date <= on).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 2).map(e => {
    const got = e.marks[s.id], tot = Number(e.total) || 0;
    const all = Object.values(e.marks).map(Number).filter(v => !isNaN(v)).sort((a, b) => b - a);
    if (got === undefined || got === '' || !tot) return {title: e.title, date: e.date, absent: true, n: all.length};
    const v = Number(got);
    return {title: e.title, date: e.date, got: v, tot, pct: Math.round(v * 100 / tot), rank: all.indexOf(v) + 1, n: all.length, top: all[0]};
  });
  return {att, ex};
}

    const ph = normPhone(o.phone), gp = normPhone(o.guardianPhone);
    const guardian = gp || ph, student = gp && ph && ph !== gp ? ph : '';
    S.students.push({id:o.id, name:o.name, shortName:o.shortName || '', guardianPhone:guardian, studentPhone:student, batch:'up10', payMode:'advance', waVerified:false, from2026:true});
    const pays = (c9.payments || {})[o.id] || {};
    for (const m in pays) {
      const mi = Number(m), d = Number(pays[m].day) || 1;
      S.payments[o.id] = S.payments[o.id] || {};
      S.payments[o.id][ym(2026, mi)] = {day:d, on:'2026-' + pad(mi + 1) + '-' + pad(d), amt:Number(pays[m].amount) || 1000, old:true};
    }
    report.push({name:o.name, guardian, student, both:!!(gp && ph && ph !== gp), fromStudentField:!gp && !!ph});
  });
  save(); ACTIVE = 'up10'; try { localStorage.setItem(ACTIVE_KEY, ACTIVE); } catch(e){}
  renderAll();
  sheet(`<div class="sh-head"><div class="sh-name">✅ ${toBn(report.filter(r => !r.skip).length)} জন উপশহর · দশমে এসেছে</div>
      <div class="sh-sub">নম্বরগুলো মিলিয়ে দেখুন, তারপর WhatsApp যাচাই করুন</div></div>
    <table class="t"><tr><th>নাম</th><th>অভিভাবক (মেসেজ যাবে)</th><th>শিক্ষার্থী</th></tr>
    ${report.map(r => r.skip ? `<tr><td>${esc(r.name)}</td><td colspan="2">আগে থেকেই আছে</td></tr>` :
      `<tr><td>${esc(r.name)}</td><td class="${validPhone(r.guardian) ? '' : 'bad-t'}">${r.guardian ? toBn(r.guardian) : 'নেই'}${validPhone(r.guardian) ? '' : ' ⚠️'}</td><td>${r.student ? toBn(r.student) : '—'}</td></tr>`).join('')}</table>
    <div class="hint">পুরনো অ্যাপে বেশিরভাগের একটিই নম্বর ছিল ("WA/কল নাম্বার")। সেটিকেই অভিভাবকের নম্বর ধরা হয়েছে। কোনোটা শিক্ষার্থীর নিজের নম্বর হলে "তথ্য বদলান"-এ ঠিক করে দিন।</div>
    <button class="btn big primary" data-act="filter" data-m="wa">📱 WhatsApp যাচাই শুরু করুন</button>
    <button class="btn ghost" data-act="close">বন্ধ করুন</button>`);
}
function hasLegacyLocal(){ try { return !!localStorage.getItem('tuition-payments-2026'); } catch(e){ return false; } }
function importLocal(){
  try {
    const c9 = JSON.parse(localStorage.getItem('tuition-payments-2026') || 'null');
    const c10 = JSON.parse(localStorage.getItem('tuition-payments-2026-class10') || 'null');
    importLegacy({class9:c9 || {students:[]}, class10:c10 || {students:[]}, exportedAt:new Date().toISOString()});
  } catch(e){ toast('পুরনো তথ্য পড়া যায়নি'); }
}
function openArchive(cls){
  const a = getArchive();
  if (!a) { sheet(`<div class="sh-head"><div class="sh-name">🗄️ ২০২৬ আর্কাইভ</div></div><div class="empty">আর্কাইভ নেই। পুরনো ব্যাকআপ রিস্টোর করলে এখানে দেখাবে।</div><button class="btn ghost" data-act="close">বন্ধ করুন</button>`); return; }
  cls = cls || 'class9';
  const c = a[cls] || {students:[]}, att = c.attendance || {}, days = Object.keys(att), ex = Object.values(c.examMarks || {});
  sheet(`<div class="sh-head"><div class="sh-name">🗄️ ২০২৬ আর্কাইভ (শুধু দেখার জন্য)</div><div class="sh-sub">ব্যাকআপের তারিখ: ${a.exportedAt ? bnDate(a.exportedAt.slice(0, 10)) : '—'}</div></div>
    <div class="light"><div class="seg"><button class="seg-btn ${cls === 'class9' ? 'on' : ''}" data-act="archive" data-c="class9">নবম ২০২৬</button><button class="seg-btn ${cls === 'class10' ? 'on' : ''}" data-act="archive" data-c="class10">দশম ২০২৬</button></div></div>
    <div class="hint" style="margin-top:8px">${toBn(c.students.length)} জন · হাজিরা ${toBn(days.length)} দিন · পরীক্ষা ${toBn(ex.length)}টি</div>
    <table class="t"><tr><th>নাম</th><th>বেতন দেওয়া মাস</th><th>হাজিরা</th></tr>
    ${c.students.map(s => { const p = Object.keys((c.payments || {})[s.id] || {}).map(Number).sort((x, y) => x - y);
      return `<tr><td>${esc(s.name)}</td><td>${p.length ? p.map(m => MS[m]).join(', ') : '—'}</td><td>${toBn(days.filter(d => (att[d] || []).includes(s.id)).length)}/${toBn(days.length)}</td></tr>`; }).join('')}</table>
    ${ex.length ? `<div class="plist"><h4>পরীক্ষা</h4>${ex.map(e => `<div class="pl-row"><span>${esc(e.title)} <small>(${esc(e.date)}, পূর্ণমান ${toBn(e.total)})</small></span></div>`).join('')}</div>` : ''}
    <button class="btn ghost" data-act="close">বন্ধ করুন</button>`);
}

/* ========== বোতামের কাজ ========== */
const ACT = {
  close: () => closeSheet(),
  branch: d => { ACTIVE = d.b; switchBatch(); },
  batch: d => { ACTIVE = d.b; switchBatch(); },
  filter: d => { FILTER.mode = (FILTER.mode === d.m && d.m !== 'all') ? 'all' : d.m; closeSheet(); renderHeader(); renderList(); window.scrollTo({top:0, behavior:'smooth'}); },
  dueTab: () => ACT.filter({m:'due'}),
  expand: d => { EXP.has(d.sid) ? EXP.delete(d.sid) : EXP.add(d.sid); updateCard(d.sid); },
  addStudent: () => openForm(null),
  edit: d => openForm(d.sid),
  formSave: d => formSave(d.sid || null),
  remove: d => removeStudent(d.sid),
  profile: d => openProfile(d.sid),
  waVerify: d => openWaVerify(d.sid),
  waOk: d => { const s = stu(d.sid); s.waVerified = true; save(); closeSheet(); updateCard(s.id); toast('WhatsApp নিশ্চিত ✓'); },
  waChat: d => { const s = stu(d.sid); if (!validPhone(s.guardianPhone)) { openForm(s.id); return; } sendMsg(s.guardianPhone, 'প্রিয় অভিভাবক, আসসালামু আলাইকুম।\n', 'wa'); },
  pay: d => openPay(d.sid),
  pYear: d => { readPay(); PAY.year = Number(d.y); renderPay(); },
  pMonth: d => { readPay(); PAY.sel.has(d.k) ? PAY.sel.delete(d.k) : PAY.sel.add(d.k); renderPay(); },
  pNote: () => { readPay(); PAY.note = !PAY.note; renderPay(); },
  pSave: () => paySave(),
  pReceipt: d => openReceipt(PAY.sid, [d.k], false, S.payments[PAY.sid][d.k].on || ym(ymP(d.k).y, ymP(d.k).m) + '-' + pad(S.payments[PAY.sid][d.k].day || 1)),
  pDel: d => { if (!confirm(ymLabel(d.k) + ' মাসের পেমেন্ট মুছবেন?')) return; delete S.payments[PAY.sid][d.k]; save(); updateCard(PAY.sid); renderPay(); toast('মুছে ফেলা হয়েছে'); },
  nfReceipt: d => openReceipt(d.sid, [], true, S.noteFees[d.sid][S.year].on),
  rWa: () => { const d = receiptData(RC.sid, RC.items, RC.note, RC.on); sendMsg(d.s.guardianPhone, d.text, 'wa'); },
  rSms: () => { const d = receiptData(RC.sid, RC.items, RC.note, RC.on); sendMsg(d.s.guardianPhone, d.text, 'sms'); },
  rShare: () => receiptShare(),
  rChatImg: () => receiptToChat(),
  qch: d => { Q.channel = d.c; renderQueue(); },
  qone: d => qOne(d.sid),
  qall: () => qAll(),
  attendance: () => openAtt(),
  attP: d => { readLate(); ATT.p.has(d.sid) ? ATT.p.delete(d.sid) : ATT.p.add(d.sid); ATT.saved = false; renderAtt(); },
  attLate: d => { readLate(); if (ATT.late[d.sid] !== undefined) delete ATT.late[d.sid]; else ATT.late[d.sid] = 0; ATT.saved = false; renderAtt(); },
  attAll: d => { readLate(); ATT.p = new Set(d.v === '1' ? list().map(s => s.id) : []); ATT.saved = false; renderAtt(); },
  attSave: () => attSave(),
  attMsg: d => attMsg(d.t),
  attCopy: () => copyText(attGroupText()),
  group: () => openGroup(),
  exams: () => openExams(),
  examNew: () => openExam(null),
  examOpen: d => openExam(d.id),
  examSave: () => examSave(),
  examImg: () => { if (examSave()) examImage(); },
  examSend: () => { if (examSave()) examSend(); },
  examDel: () => { if (!confirm('পরীক্ষাটি মুছবেন?')) return; delete exams()[EX.id]; save(); openExams(); },
  messages: () => openMsg(),
  msgType: d => { MSG.type = d.t; openMsg(); },
  msgCopy: () => copyText(fill($('#msgText').value)),
  msgSaveTpl: () => { S.templates[tplKey(MSG.type)] = $('#msgText').value; save(); toast('টেমপ্লেট সেভ হয়েছে ✓'); },
  msgQueue: () => {
    const text = $('#msgText').value;
    const L = MSG.type === 'fee' ? list().filter(s => dueList(s).length) : list();
    if (!L.length) { toast('কেউ নেই'); return; }
    openQueue({off:'ক্লাস বন্ধ', done:'পড়া শেষ', chap:'অধ্যায় সংক্ষেপ', fee:'বেতন রিমাইন্ডার', custom:'মেসেজ'}[MSG.type] + ' · ' + batchName(ACTIVE),
      L.map(s => ({sid:s.id, name:s.name, phone:s.guardianPhone, text:fill(text, s)})), 'msg-' + ACTIVE + '-' + MSG.type + '-' + todayKey() + '-' + hash(text));
  },
  more: () => openMore(),
  summary: () => openSummary(),
  settings: () => openSettings(),
  settingsSave: () => settingsSave(),
  backup: () => backup(),
  restore: () => $('#restoreInput').click(),
  importLocal: () => importLocal(),
  archive: d => openArchive(d.c)
};
function switchBatch(){
  try { localStorage.setItem(ACTIVE_KEY, ACTIVE); } catch(e){}
  FILTER.q = ''; $('#search').value = ''; EXP.clear(); renderAll(); window.scrollTo({top:0});
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') e.preventDefault();
  f(el.dataset, el);
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.chg;
  if (k === 'attDate' && e.target.value) { openAtt(e.target.value); }
  if (k === 'msgChap') { MSG.chap = Number(e.target.value); openMsg(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') { FILTER.q = e.target.value; renderList(); }
  if (e.target.dataset && e.target.dataset.phone) checkPhones();
});
$('#restoreInput').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { handleRestore(JSON.parse(r.result)); } catch(err){ toast('ফাইলটি পড়া যায়নি'); } e.target.value = ''; };
  r.readAsText(f);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && SHEET_KIND === 'queue') renderQueue(); });

renderAll();

/* রশিদ দ্রুত করতে: ফন্ট, লোগো, স্বাক্ষর আগেভাগে লোড */
setTimeout(() => { fontsReady(); loadImg('logo.png'); loadImg(SIG_IMG); }, 1500);
/* ---- ডেটা সুরক্ষা: ফোন যেন জায়গা খালি করতে ডেটা না মোছে + সাপ্তাহিক ব্যাকআপ মনে করানো ---- */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()); } catch(e){}
try {
  const lb = localStorage.getItem('bsc-last-backup');
  const days = lb ? (Date.now() - new Date(lb).getTime()) / 864e5 : 999;
  const hasData = Object.keys(localStorage).some(k => k.startsWith('bsc') && (localStorage.getItem(k) || '').length > 500);
  if (hasData && days > 7) setTimeout(() => toast('💾 ৭ দিনের বেশি ব্যাকআপ নেই: ☰ আরও → ব্যাকআপ ডাউনলোড'), 3500);
} catch(e){}
/* ---- অ্যাপ ইনস্টল ---- */
(function(){
  const isApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const box = $('#inst'), go = $('#instGo'), msg = $('#instMsg');
  let deferred = null;
  const snoozed = () => { try { return Date.now() < Number(localStorage.getItem('bsc-inst-snooze') || 0); } catch(e){ return false; } };
  $('#instX').onclick = () => { box.classList.remove('show'); try { localStorage.setItem('bsc-inst-snooze', Date.now() + 3*864e5); } catch(e){} };
  if (isApp || NATIVE) return;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    if (!snoozed()) box.classList.add('show');
  });
  go.onclick = async () => {
    if (deferred) { deferred.prompt(); const r = await deferred.userChoice; deferred = null; if (r.outcome === 'accepted') box.classList.remove('show'); return; }
    box.classList.remove('show');
  };
  window.addEventListener('appinstalled', () => { box.classList.remove('show'); toast('✅ অ্যাপ ইনস্টল হয়েছে: হোম স্ক্রিন থেকে খুলুন'); });
  const ua = navigator.userAgent;
  const inApp = /FBAN|FBAV|Instagram|WhatsApp|Line\/|wv\)/i.test(ua);
  const ios = /iPhone|iPad|iPod/i.test(ua);
  setTimeout(() => {
    if (deferred || snoozed()) return;
    if (inApp) { msg.textContent = 'এখানে ইনস্টল হয় না। ⋮ মেনু থেকে "Chrome-এ খুলুন" চাপুন, তারপর ইনস্টল করুন'; go.style.display = 'none'; box.classList.add('show'); }
    else if (ios) { msg.textContent = 'Safari-তে নিচের Share (⬆️) চাপুন → "Add to Home Screen"'; go.style.display = 'none'; box.classList.add('show'); }
  }, 2500);
})();
/* হোম স্ক্রিন আইকনে চেপে ধরে শর্টকাট (হাজিরা/বকেয়া/মেসেজ) */
try { const g = new URLSearchParams(location.search).get('go'); if (g && ACT[g]) { history.replaceState(null, '', location.pathname); setTimeout(() => ACT[g]({}, null), 300); } } catch(e){}
/* ---- আপডেট: নতুন ভার্সন এলে নিজে থেকে চালু হবে ---- */
try { const pv = localStorage.getItem('bsc-version'); if (pv && pv !== APP_VERSION) setTimeout(() => toast('✅ অ্যাপ আপডেট হয়েছে: ' + APP_VERSION), 600); localStorage.setItem('bsc-version', APP_VERSION); } catch(e){}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    if ($('#sheet')) { toast('নতুন আপডেট এসেছে: অ্যাপ বন্ধ করে আবার খুলুন'); return; }
    reloading = true; location.reload();
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {}));
}
</script>
